defaults:
  - env/realworld_franka_polymetis@env.eval
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  # Single-node: everything (env worker + controller) runs on TASL-1 Desktop.
  # The robot is reached over Tailscale via zerorpc (no second cluster node).
  num_nodes: 1
  component_placement:
    env:
      node_group: franka
      placement: 0
  node_groups:
    - label: franka
      node_ranks: 0
      hardware:
        type: Franka
        configs:
          - robot_ip: 100.75.6.62       # NUC1 Tailscale IP — polymetis zerorpc :4242
            node_rank: 0
            camera_serials:
              - "36443134"              # Exterior ZED 2i
              - "17150101"              # Wrist ZED Mini
            camera_type: zed
            gripper_type: robotiq
            gripper_connection: null    # Gripper driven via DROID zerorpc on NUC
            controller_type: polymetis  # Selects PolymetisController backend

runner:
  task_type: embodied
  logger:
    log_path: ./outputs/pilot
    project_name: rlinf
    experiment_name: "collect-data-polymetis"
    logger_backends: ["tensorboard"]
  num_data_episodes: 1
  record_task_description: False

env:
  group_name: "EnvGroup"
  eval:
    ignore_terminations: False
    auto_reset: False
    use_spacemouse: True
    override_cfg:
      task_description: "pick up the cube"
      target_ee_pose: [0.5, 0.0, 0.1, -3.14, 0.0, 0.0]
      success_hold_steps: 1

    data_collection:
      enabled: True
      save_dir: ${runner.logger.log_path}/collected_data
      export_format: "lerobot"
      only_success: True
      robot_type: "panda"
      fps: 10
