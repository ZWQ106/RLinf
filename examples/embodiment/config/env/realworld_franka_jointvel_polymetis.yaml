env_type: realworld

total_num_envs: 1

auto_reset: False
ignore_terminations: False
reward_mode: raw
wrap_obs_mode: simple
seed: 0
group_size: 1
use_fixed_reset_state_ids: False
max_steps_per_rollout_epoch: 300
max_episode_steps: 1000000
use_spacemouse: False
gello_kp: 4.0
gello_vmax: 1.0
main_image_key: wrist_1

video_cfg:
  # Record an MP4 per eval episode showing BOTH cameras (exterior | wrist)
  # tiled side-by-side. Frames are the 128² policy-view crops; one panel per
  # camera. Lands under video_base_dir/seed_<seed>/<n>.mp4 (host-visible via
  # the bind-mounted repo). RecordVideo wraps the env when save_video is True.
  save_video: True
  info_on_video: True
  # Obs frames are already RGB — _get_camera_frames reverses the ZED's BGR
  # (retrieve_image gives BGRA -> [:, :, :3] = BGR, then [..., ::-1] -> RGB),
  # which is also what the policy consumes. imageio writes RGB, so the recorder
  # must NOT swap again; keep this False (a swap here produced BGR-looking MP4s).
  frames_bgr: False
  # Control/streaming rate of the joint-velocity rollout (chunk loop @ 15 Hz).
  fps: 15
  # Upscale the recorded frame to this height (px, aspect preserved) for a
  # viewable MP4 — source frames are the 128² policy-view crops, so this
  # enlarges for viewing, not extra detail. Two 128² cams tiled -> 720x1440.
  video_height: 720
  video_base_dir: ${runner.logger.log_path}/video/eval

init_params:
  id: "FrankaJointVelEnv-v1"
  num_envs: null

override_cfg:
  # Task description shown to VLA policy (placeholder — update before real runs).
  task_description: "pick up the cube"
  # Polymetis backend: gripper is driven by DROID's zerorpc server on NUC.
  # No local serial device — gripper_connection must be null.
  gripper_type: "robotiq"
  gripper_connection: null
  controller_type: "polymetis"
  # Camera type matches the ZED 2i / ZED Mini hardware on TASL-1 Desktop.
  camera_type: "zed"
  # Serial order: exterior ZED 2i first (wrist_1), wrist ZED Mini second (wrist_2).
  camera_serials:
    - "36443134"
    - "17150101"

  # ZED capture resolution for the raw per-episode SVO. HD1080 confirmed
  # feasible @15Hz for both cams (0 drops).
  camera_resolution: [1280, 720]

  # DROID-correct image preprocessing for zero-shot pi05_droid eval:
  #   image_resize_mode: pad  -> letterbox to square, preserving the FULL FOV
  #     (matches openpi's tf.image.resize_with_pad). A centre crop (the
  #     collection default) drops ~44% of the ZED width and wrecks the policy.
  #   obs_image_size: 224     -> feed the model's native size directly, so
  #     openpi's internal resize_with_pad is a no-op (no lossy 128->224 step).
  image_resize_mode: pad
  obs_image_size: 224

  # Reset/home joint pose: DROID home [q1..q7] in radians.
  joint_reset_qpos: [0.0, -0.6283, 0.0, -2.5133, 0.0, 1.8850, 0.0]

  # EE reset pose [x, y, z, rx, ry, rz] — measured FK of joint_reset_qpos
  # (DROID home) on the real arm (P1 smoke 2026-06-12). The EE-convergence
  # stage of go_to_rest must agree with the joint reset, or it drags the
  # arm into a low forward lean after every episode.
  reset_ee_pose: [0.37, 0.0, 0.48, -3.14, 0.0, 0.0]

  # Target EE pose for success-checking and orientation clipping.
  # TODO(P1): measure with get_tcp_pose() at grasp commit and update.
  target_ee_pose: [0.5, 0.0, 0.1, -3.14, 0.0, 0.0]

  max_num_steps: 1000000

  # Position success tolerance [x, y, z, rx, ry, rz]; FrankaEnv checks xyz only.
  reward_threshold: [0.01, 0.01, 0.01, 0.2, 0.2, 0.2]

  # Success hold steps (set > 1 to require temporal consistency).
  success_hold_steps: 1

  # Gripper penalty disabled for data-collection runs.
  enable_gripper_penalty: false

  # [xyz delta scale, rpy delta scale, gripper scale] — serl defaults.
  # TODO(P1): tune after first hardware measurements.
  action_scale: [1.0, 1.0, 1.0]

  # Workspace safety box [x, y, z, rx, ry, rz] — serl defaults; tune via P1.
  ee_pose_limit_min: [0.25, -0.35, 0.03, -3.64, -0.5, -0.5]
  ee_pose_limit_max: [0.75, 0.35, 0.40, -2.64, 0.5, 0.5]

  # Step frequency (Hz) — serl default; polymetis backend honors this via sleep.
  step_frequency: 15.0

  # Compliance and precision params are ROS/serl concepts; polymetis backend
  # logs and ignores them.  Kept so the config is valid if the backend is
  # swapped back to serl.
  compliance_param:
    translational_stiffness: 2000
    translational_damping: 89
    rotational_stiffness: 150
    rotational_damping: 7
    translational_Ki: 0
    translational_clip_x: 0.003
    translational_clip_y: 0.003
    translational_clip_z: 0.01
    translational_clip_neg_x: 0.003
    translational_clip_neg_y: 0.003
    translational_clip_neg_z: 0.01
    rotational_clip_x: 0.02
    rotational_clip_y: 0.02
    rotational_clip_z: 0.02
    rotational_clip_neg_x: 0.02
    rotational_clip_neg_y: 0.02
    rotational_clip_neg_z: 0.02
    rotational_Ki: 0
  precision_param:
    translational_stiffness: 3000
    translational_damping: 89
    rotational_stiffness: 300
    rotational_damping: 9
    translational_Ki: 0.1
    translational_clip_x: 0.01
    translational_clip_y: 0.01
    translational_clip_z: 0.01
    translational_clip_neg_x: 0.01
    translational_clip_neg_y: 0.01
    translational_clip_neg_z: 0.01
    rotational_clip_x: 0.05
    rotational_clip_y: 0.05
    rotational_clip_z: 0.05
    rotational_clip_neg_x: 0.05
    rotational_clip_neg_y: 0.05
    rotational_clip_neg_z: 0.05
    rotational_Ki: 0.1
