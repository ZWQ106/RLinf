# TASL FR3 bench: PICO/XRoboToolkit-style VR teleop on the upstream SERL
# cartesian-impedance backend, two Ray nodes.
#
#   node 0  TASL-1 Desktop (GPU, 172.16.0.3): env worker + ZED cameras + PicoIntervention
#   node 1  NUC1           (RT kernel, 172.16.0.2): FrankaController (ROS1 + serl_franka_controllers)
#                          + Robotiq 2F-85 on /dev/ttyUSB0
#
# VR poses arrive over ZeroMQ on the Desktop in the pico_software
# VRDataMessage schema (XRT PC-Service publisher or the Quest WebXR adapter).
# Bring-up: deploy/rlinf/ in github.com/ZWQ106/remote_teleop.
defaults:
  - env/realworld_peg_insertion@env.eval
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 2
  component_placement:
    env:
      node_group: franka
      placement: 0
  node_groups:
    - label: franka
      node_ranks: 0-1
      hardware:
        type: Franka
        configs:
          - robot_ip: 172.16.0.1          # FR3 control box (FCI), reached from the NUC
            node_rank: 0
            camera_serials:
              - "36443134"                # exterior ZED 2i   -> wrist_1
              - "17150101"                # wrist ZED Mini    -> wrist_2
            camera_type: zed
            gripper_type: robotiq
            gripper_connection: "/dev/ttyUSB0"
            controller_node_rank: 1       # FrankaController runs on the NUC
            disable_validate: false

runner:
  task_type: embodied
  logger:
    log_path: ./outputs/pico_serl
    project_name: rlinf
    experiment_name: "collect-data-pico-serl"
    logger_backends: ["tensorboard"]
  num_data_episodes: 1
  record_task_description: False

env:
  group_name: "EnvGroup"
  eval:
    ignore_terminations: False
    auto_reset: False
    use_spacemouse: False
    use_pico: True
    no_gripper: False
    pico:
      zmq_addr: "tcp://127.0.0.1:5560"   # publisher on the Desktop host (container is host-net)
      position_scale: 1.0
      rotation_scale: 1.0
      calibration:
        button: "trigger"
    max_episode_steps: 10000
    init_params:
      id: "FrankaEnv-v1"                 # base env: explicit workspace box below (PegInsertion's ±5 cm box is too tight for teleop)
      num_envs: null
    override_cfg:
      task_description: "pick up the cube"
      camera_type: zed
      gripper_type: robotiq
      gripper_connection: "/dev/ttyUSB0"

      # Reset: DROID home joints and its measured FK (validated on this arm).
      joint_reset_qpos: [0.0, -0.6283, 0.0, -2.5133, 0.0, 1.8850, 0.0]
      reset_ee_pose: [0.37, 0.0, 0.48, -3.14, 0.0, 0.0]
      target_ee_pose: [0.5, 0.0, 0.1, -3.14, 0.0, 0.0]
      enable_random_reset: false
      success_hold_steps: 1
      enable_gripper_penalty: false
      max_num_steps: 10000

      # Workspace box [x, y, z, rx, ry, rz]
      ee_pose_limit_min: [0.25, -0.35, 0.03, -3.64, -0.5, -0.5]
      ee_pose_limit_max: [0.75, 0.35, 0.40, -2.64, 0.5, 0.5]

      # Per-step clip of the normalized ±1 action: 2 cm / 0.1 rad @ 10 Hz
      # (upstream peg-insertion values; the serl controller smooths between steps).
      action_scale: [0.02, 0.1, 1.0]
      step_frequency: 10.0

      # serl cartesian impedance, applied at every reset via dynamic_reconfigure.
      # Teleop first cut: PegInsertion gains, but 1 cm / 0.05 rad error clips
      # (PegInsertion's 3 mm clip caps the tracking force at ~6 N).
      compliance_param:
        translational_stiffness: 2000
        translational_damping: 89
        rotational_stiffness: 150
        rotational_damping: 7
        translational_Ki: 0
        translational_clip_x: 0.01
        translational_clip_y: 0.01
        translational_clip_z: 0.01
        translational_clip_neg_x: 0.01
        translational_clip_neg_y: 0.01
        translational_clip_neg_z: 0.01
        rotational_clip_x: 0.05
        rotational_clip_y: 0.05
        rotational_clip_z: 0.05
        rotational_clip_neg_x: 0.05
        rotational_clip_neg_y: 0.05
        rotational_clip_neg_z: 0.05
        rotational_Ki: 0
      precision_param:
        translational_stiffness: 3000
        translational_damping: 89
        rotational_stiffness: 300
        rotational_damping: 9
        translational_Ki: 0.1
        translational_clip_x: 0.01
        translational_clip_y: 0.01
        translational_clip_z: 0.01
        translational_clip_neg_x: 0.01
        translational_clip_neg_y: 0.01
        translational_clip_neg_z: 0.01
        rotational_clip_x: 0.05
        rotational_clip_y: 0.05
        rotational_clip_z: 0.05
        rotational_clip_neg_x: 0.05
        rotational_clip_neg_y: 0.05
        rotational_clip_neg_z: 0.05
        rotational_Ki: 0.1

    data_collection:
      enabled: True
      save_dir: ${runner.logger.log_path}/collected_data
      export_format: "lerobot"
      only_success: True
      robot_type: "panda"
      fps: 10
