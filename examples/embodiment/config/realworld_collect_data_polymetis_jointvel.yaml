defaults:
  - env/realworld_franka_jointvel_polymetis@env.eval
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  # Single-node: everything (env worker + controller) runs on TASL-1 Desktop.
  # The robot is reached over Tailscale via zerorpc (no second cluster node).
  num_nodes: 1
  component_placement:
    env:
      node_group: franka
      placement: 0
  node_groups:
    - label: franka
      node_ranks: 0
      hardware:
        type: Franka
        configs:
          - robot_ip: 100.75.6.62       # NUC1 Tailscale IP — polymetis zerorpc :4242
            node_rank: 0
            camera_serials:
              - "36443134"              # Exterior ZED 2i
              - "17150101"              # Wrist ZED Mini
            camera_type: zed
            gripper_type: robotiq
            gripper_connection: null    # Gripper driven via DROID zerorpc on NUC
            controller_type: polymetis  # Selects PolymetisController backend

runner:
  task_type: embodied
  logger:
    log_path: ./outputs/pilot
    project_name: rlinf
    experiment_name: "collect-data-polymetis"
    logger_backends: ["tensorboard"]
  num_data_episodes: 1
  record_task_description: False

env:
  group_name: "EnvGroup"
  eval:
    ignore_terminations: False
    auto_reset: False
    # Teleop device: GELLO (joint-level leader arm). Set use_gello False +
    # use_spacemouse True to fall back to the SpaceMouse. gello_port is the
    # OpenRB-150 (calibrated 2026-06-16, config in gello PORT_CONFIG_MAP).
    use_spacemouse: False
    use_gello: True
    gello_port: "/dev/ttyACM0"
    # Pick task needs the gripper: framework default no_gripper=True wraps the
    # env in GripperCloseEnv (6-D actions, gripper locked) and disables the
    # teleop gripper control.
    no_gripper: False
    # Operator labels success with the keyboard (reward 1 + done); auto-reward
    # via target_ee_pose is unreliable until that pose is measured (TODO(P1)).
    keyboard_reward_wrapper: single_stage
    # Two-stage start gate: 's' RELEASES the robot (teleop live, nothing
    # recorded) so the operator can drive it into the true starting pose, then
    # 'r' begins recording. Getting into position is not part of the
    # demonstration, and recording it teaches the policy motions we don't want.
    release_before_record: True
    override_cfg:
      task_description: "pick up the cube"
      target_ee_pose: [0.5, 0.0, 0.1, -3.14, 0.0, 0.0]
      success_hold_steps: 1
      obs_image_size: 224

    data_collection:
      enabled: True
      save_dir: ${runner.logger.log_path}/collected_data
      export_format: "lerobot"
      only_success: True
      robot_type: "panda"
      fps: 15
      record_svo: True
      repo_id: "tasl/fr3_pickcube_v1"
      # Container-internal paths: /workspace/rlinf is the only writable host mount
      # (-> host ~/work/rlinf-clone). A host path like ~/work/datasets would land
      # in the container's ephemeral overlay and be lost on restart / invisible to host.
      root: "/workspace/rlinf/datasets/fr3_pickcube_v1"
      svo_dir: "/workspace/rlinf/datasets/fr3_pickcube_v1_svo"
      save_pt_trajectory: False
