# Remote-teleop latency study on the TASL FR3 bench.
#
# Identical to the lab's GELLO baseline path (realworld_collect_data_polymetis_jointvel:
# FrankaJointVelEnv 15 Hz, joint-velocity P-control on the leader, polymetis on
# NUC1, ZED 2i + ZED Mini, lerobot export) plus:
#   leader_delay        emulated operator->robot delay on the GELLO stream
#                       (DelayedGelloJointIntervention; tau_f=0 = baseline behaviour)
#   camera_stream_addr  JPEG stream of both cameras so the operator's display
#                       can be delayed by tau_b (rteleop delayed viewer)
# Override per condition from the command line, e.g.
#   env.eval.leader_delay.tau_f=0.3 env.eval.leader_delay.mode=queued \
#   env.eval.data_collection.repo_id=remote/T1a_tf300_direct
defaults:
  - env/realworld_franka_jointvel_polymetis@env.eval
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env:
      node_group: franka
      placement: 0
  node_groups:
    - label: franka
      node_ranks: 0
      hardware:
        type: Franka
        configs:
          - robot_ip: 172.16.0.2        # NUC1 over the Franka switch LAN — polymetis zerorpc :4242
            node_rank: 0
            camera_serials:
              - "36443134"              # Exterior ZED 2i  -> wrist_1
              - "17150101"              # Wrist ZED Mini   -> wrist_2
            camera_type: zed
            gripper_type: robotiq
            gripper_connection: null    # gripper via DROID zerorpc on the NUC
            controller_type: polymetis

runner:
  task_type: embodied
  logger:
    log_path: ./outputs/delay
    project_name: rlinf
    experiment_name: "collect-data-jointvel-delay"
    logger_backends: ["tensorboard"]
  num_data_episodes: 1
  record_task_description: False

env:
  group_name: "EnvGroup"
  eval:
    ignore_terminations: False
    auto_reset: False
    use_spacemouse: False
    use_gello: True
    gello_port: "/dev/gello"
    no_gripper: False
    keyboard_reward_wrapper: single_stage
    release_before_record: True

    # Forward delay emulation on the leader stream. tau_f/jitter in seconds.
    # mode: direct (naive remote) | queued (MATER-style command queue + playout).
    leader_delay:
      tau_f: 0.0
      jitter_s: 0.0
      jitter_dist: uniform
      mode: direct
      playout_s: 0.05
      sample_hz: 50.0
      seed: 0

    override_cfg:
      task_description: "pick up the blue cup and place it into the red cup"
      target_ee_pose: [0.5, 0.0, 0.1, -3.14, 0.0, 0.0]
      success_hold_steps: 1
      obs_image_size: 224
      camera_stream_addr: "tcp://127.0.0.1:5561"
      camera_stream_names: ["wrist_1"]   # exterior ZED 2i only (operator view)
      camera_fps: 30          # HD720@30 for the operator view (dataset stays 15 Hz)

    data_collection:
      enabled: True
      save_dir: ${runner.logger.log_path}/collected_data
      export_format: "lerobot"
      only_success: True
      robot_type: "panda"
      fps: 15
      record_svo: True
      repo_id: "remote/T1a_tf000_direct"
      root: "/workspace/rlinf/datasets/remote/T1a_tf000_direct"
      svo_dir: "/workspace/rlinf/datasets/remote/T1a_tf000_direct_svo"
      save_pt_trajectory: False
