# Real-world eval config for pi05_droid (PI's public DROID-trained checkpoint)
# on the TASL Franka FR3 bench — POLYMETIS controller variant.
#
# We use RLinf only for efficient pi05_droid inference; the arm is driven by the
# SAME polymetis zerorpc controller as GELLO collect (PolymetisController over
# DROID's zerorpc :4242), NOT the franky robot_server. RLinf's chunked rollout
# runs over polymetis via RealWorldEnv.chunk_step, which streams the predicted
# chunk action-by-action through update_joint_velocity (~15 Hz) — the proven
# GELLO teleop streaming path.
#
# Differs from realworld_eval_pi05_droid.yaml (HTTP/franky) only in the
# controller wiring: env = realworld_franka_jointvel_polymetis, and the robot
# identity (robot_ip / controller_type / cameras / gripper) comes from the
# node_groups hardware block, not from a robot_server_url. The model / rollout /
# actor / algorithm blocks are identical.
#
# Launch: via the eval dashboard (tasl/dashboards/rlinf.py) → Start, or
#   python examples/embodiment/eval_embodied_agent.py \
#     --config-name realworld_eval_pi05_droid_polymetis
# Pre-req: polymetis droid container up on NUC1 (zerorpc :4242), FCI active.

defaults:
  - env/realworld_franka_jointvel_polymetis@env.train
  - env/realworld_franka_jointvel_polymetis@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  # Single-node: env + actor + rollout all on the TASL-1 Desktop. The env worker
  # reaches the robot over zerorpc to NUC1 (no second Ray node). Hardware (robot
  # IP, controller, cameras, gripper) is declared on the node_group, exactly like
  # realworld_collect_data_polymetis_jointvel.
  num_nodes: 1
  component_placement:
    actor:
      node_group: franka
      placement: 0
    env:
      node_group: franka
      placement: 0
    rollout:
      node_group: franka
      placement: 0
  node_groups:
    - label: franka
      node_ranks: 0
      hardware:
        type: Franka
        configs:
          - robot_ip: 172.16.0.2        # NUC1 robot-net IP — polymetis zerorpc :4242
            node_rank: 0
            camera_serials:
              - "36443134"              # Exterior ZED 2i  -> wrist_1 (DROID main)
              - "17150101"              # Wrist ZED Mini   -> wrist_2
            camera_type: zed
            gripper_type: robotiq
            gripper_connection: null    # gripper driven via DROID zerorpc on NUC
            controller_type: polymetis  # selects PolymetisController backend

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "pi05_droid_zero_shot_eval_polymetis"
    logger_backends: ["tensorboard"]

  max_epochs: 8000
  max_steps: -1

  only_eval: True
  write_eval_summary: True
  stop_eval_on_keyboard_success: False
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null  # zero-shot; pi05_droid loaded via rollout.model.model_path

algorithm:
  # Eval-only; algorithm block is required by the runner but values mostly ignored.
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  staleness_threshold: 1
  behave_weight_threshold: 2

  rollout_epoch: 24
  eval_rollout_epoch: 1   # 1 episode per Start click; user controls cadence via dashboard
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 2

  adv_type: gae
  loss_type: decoupled_actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0.005
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    # Required by schema; only_eval=True so values mostly unused. The robot
    # identity + camera + gripper come from the env default
    # (realworld_franka_jointvel_polymetis) + the node_groups hardware block.
    ignore_terminations: True
    main_image_key: wrist_1
    total_num_envs: 1
    max_steps_per_rollout_epoch: 200
    max_episode_steps: 200
    use_gello: False          # policy drives the arm, not the GELLO leader
    override_cfg:
      task_description: "grasp"
      max_num_steps: 200

  eval:
    ignore_terminations: False
    stop_chunk_on_done: True
    main_image_key: wrist_1
    total_num_envs: 1
    max_steps_per_rollout_epoch: 200   # must be divisible by num_action_chunks (8)
    max_episode_steps: 200
    use_gello: False
    override_cfg:
      task_description: "grasp"
      max_num_steps: 300
    data_collection:
      enabled: True
      save_dir: "/tmp/rlinf_pi05_droid_eval"
      export_format: "lerobot"
      only_success: False
      save_debug_media: True
      debug_video_fps: 10

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10              # Not used by openpi but field is required
  enable_offload: False
  pipeline_stage_num: 1

  model:
    # Pi05_droid PyTorch-converted checkpoint (mounted at /ckpts/pi05_droid_pt).
    model_path: /ckpts/pi05_droid_pt
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 80
  global_batch_size: 480
  seed: 0
  enable_offload: False

  model:
    model_path: /ckpts/pi05_droid_pt
    model_type: "openpi"
    add_value_head: True
    num_action_chunks: 8           # streamed action-by-action by RealWorldEnv.chunk_step
    num_steps: 4
    openpi:
      value_after_vlm: True
      config_name: "pi05_droid"    # OUR registered TrainConfig (droid_dataconfig.py)
      num_images_in_input: 2       # DROID = 1 exterior + 1 wrist
      noise_method: "flow_noise"
      action_horizon: 8       # DO NOT set below 8 — pretrained model uses horizon=15
      noise_params: [0.16, 0.12, 200]
      joint_logprob: True
    policy_setup: widowx_bridge    # Not used for real-world but field required

  optim:
    lr: 7.91e-6
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-05
    clip_grad: 1.0
    critic_warmup_steps: 10

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
