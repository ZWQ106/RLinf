# Stage-3 smoke: advantages for the 2026-06-12 bench pilot dataset using the
# smoke value checkpoint (30 steps — values are NOT meaningful, this only
# validates the pipeline plumbing on our schema).

defaults:
  - model/value@advantage.model

advantage:
  value_checkpoint: /workspace/rlinf/outputs/value_sft_pilot/value_sft_pilot_smoke/checkpoints/global_step_30/actor/model_state_dict/full_weights.pt
  batch_size: 64
  flush_interval: 64
  num_dataloader_workers_per_gpu: 4
  prefetch_factor: 2
  discount_next_value: true
  positive_quantile: 0.3
  tag: pilot
  returns_tag: pilot

  model:
    critic_expert_variant: "gemma_1m"
    tokenizer_path: /workspace/rlinf/outputs/models/gemma3
    siglip_path: /workspace/rlinf/outputs/models/siglip2
    gemma3_path: /workspace/rlinf/outputs/models/gemma3

data:
  model_type: "pi05"
  robot_type: "franka"

  train_data_paths:
    - dataset_path: "/opt/.cache/huggingface/lerobot/outputs/pilot/collected_data/rank_0/id_0"
      robot_type: "franka"
      type: "rollout"
      weight: 1.0

  advantage_lookahead_step: 10
  gamma: 1.0

distributed:
  enabled: true
  backend: "nccl"
  timeout: 3600

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
